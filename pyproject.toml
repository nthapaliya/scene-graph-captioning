[project]
name = "scene-graph-captioning"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.10.8",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "nltk>=3.9.4",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pillow>=12.2.0",
    "rouge-score>=0.1.2",
    "scikit-image>=0.26.0",
    "torch>=2.10.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.47",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.12",
]
